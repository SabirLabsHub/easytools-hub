<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyTools Hub - Free Online Tools</title>
<meta name="description" content="EasyTools Hub - calculators, converters, image tools, PDF tools, QR generator, text tools and weather.">
<style>
:root{--bg:#070a11;--card:#151b27e8;--card2:#222a37;--text:#f5f7fb;--muted:#aeb7c7;--line:#ffffff18;--a:#73a3ff;--a2:#63ddff}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,Arial;color:var(--text);background:var(--bg)}
body{min-height:100vh}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;background:radial-gradient(circle at 15% 15%,#3b65c833,transparent 32%),radial-gradient(circle at 85% 75%,#23cce322,transparent 35%),#070a11}
.gridbg{position:fixed;inset:0;z-index:-1;opacity:.22;background-image:linear-gradient(#7aa7ff0b 1px,transparent 1px),linear-gradient(90deg,#7aa7ff0b 1px,transparent 1px);background-size:42px 42px}
.wrap{width:min(1100px,92%);margin:auto}header{position:sticky;top:0;z-index:5;background:#070a11cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:white;text-decoration:none;font-size:19px}.brand span{color:var(--a2)}
nav a{color:var(--muted);text-decoration:none;margin-left:14px;font-size:14px}
main{padding:30px 0 60px}.hero{text-align:center;padding:20px 0 28px}.badge{display:inline-block;padding:8px 13px;border:1px solid #73a3ff44;border-radius:30px;background:#73a3ff12;color:#d5e1ff;font-size:12px}
h1{font-size:clamp(32px,7vw,58px);line-height:1;margin:15px 0 10px}.hero p{color:var(--muted);line-height:1.6;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.toolcard{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:0 20px 60px #0004}
.toolcard{cursor:pointer;transition:.2s}.toolcard:hover{transform:translateY(-3px);border-color:#63ddff55}.toolcard h3{margin:8px 0 5px}.toolcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.ico{font-size:28px}
.tool{max-width:920px;margin:auto}.back{margin-bottom:14px}.back a{color:#cbd9ff;text-decoration:none}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
label{display:block;font-size:13px;color:#cbd3e0;margin-bottom:6px}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;background:#101723;color:white;border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}textarea{min-height:190px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--a2));color:#07101a}button.secondary{background:#202a39;color:white;border:1px solid var(--line)}
.result{margin-top:16px;padding:16px;border-radius:15px;background:#ffffff08;border:1px solid var(--line);line-height:1.65}.small{color:var(--muted);font-size:13px}.hidden{display:none!important}
.weather-now{background:linear-gradient(145deg,#272d38,#202630);border-radius:24px;padding:23px}.nowmain{display:flex;justify-content:space-between;align-items:center}.temp{font-size:70px}.condition{text-align:right}.hourly{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;text-align:center;color:#c6ceda;margin-top:22px}.wi{font-size:28px;margin:9px 0}.warming{margin-top:16px;padding:18px;border-radius:19px;background:#252b35}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:16px}.day{background:#252b35;border-radius:17px;padding:13px 6px;text-align:center;color:#bec7d4;font-size:12px}.day.active{border:2px solid #e7ebf3;color:white;padding:11px 4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.stat{background:#252b35;border-radius:17px;padding:17px}
footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}
@media(max-width:760px){nav a{display:none}.grid,.row,.row3{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,1fr)}.hourly{grid-template-columns:repeat(3,1fr)}.temp{font-size:58px}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="gridbg"></div>
<header><div class="wrap nav"><a class="brand" href="#home">EasyTools<span> Hub</span></a><nav><a href="#home">All Tools</a><a href="#weather">Weather</a></nav></div></header>
<main class="wrap">
<section id="home">
<div class="hero"><span class="badge">✦ Smart tools · mobile friendly · AI-style background</span><h1>Simple tools for everyday work.</h1><p>Free calculators, converters, image utilities, PDF tools, QR generator, text tools and a live weather dashboard.</p></div>
<div class="grid" id="cards"></div>
</section>
<section id="toolview" class="hidden"></section>
</main>
<footer><div class="wrap">EasyTools Hub · Free browser-based tools</div></footer>
<script>
const tools=[
['calculator','🧮','Scientific Calculator','Advanced calculator with trigonometry, logarithms, powers and more.'],
['age','🎂','Age Calculator','Calculate exact age from date of birth.'],
['profit','💰','Profit Calculator','Calculate profit, loss and margin.'],
['percentage','％','Percentage Calculator','Calculate percentages quickly.'],
['discount','🏷️','Discount Calculator','Calculate discount and final price.'],
['emi','🏦','Loan / EMI Calculator','Estimate monthly payment and interest.'],
['bmi','⚖️','BMI Calculator','Calculate BMI from height and weight.'],
['tax','🧾','Tax Calculator','Calculate tax and total amount.'],
['units','🔄','Unit Converter','Convert common units.'],
['qr','▦','QR Code Generator','Create a QR code from text or URL.'],
['compress','🗜️','Image Compressor','Compress an image in your browser.'],
['jpg','🖼️','Image to JPG','Convert an image to JPG.'],
['png','🖼️','Image to PNG','Convert an image to PNG.'],
['webp','🖼️','Image to WEBP','Convert an image to WEBP.'],
['resize','↔️','Image Resizer','Resize an image.'],
['rotate','⟳','Image Rotator','Rotate an image.'],
['imagepdf','📄','Image to PDF','Turn an image into a printable PDF.'],
['ocr','🔎','Image to Text','Extract text from an image.'],
['counter','🔤','Word & Character Counter','Count words and characters.'],
['case','Aa','Case Converter','Change text case.'],
['textpdf','📝','Text to PDF','Print text as PDF.'],
['invoice','🧾','Invoice Maker','Create a simple invoice.'],
['weather','☁️','Weather','Current weather, hourly and 7-day forecast.']
];
cards.innerHTML=tools.map(t=>`<div class="toolcard" onclick="${t[0]==='calculator' ? "location.href='calculator.html'" : "location.hash='"+t[0]+"'"}"><div class="ico">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p></div>`).join('');
const W={0:['☀️','Clear sky'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Rime fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Rain showers'],81:['🌧️','Rain showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
function shell(title,html){toolview.innerHTML=`<div class="tool"><div class="back"><a href="#home">← All Tools</a></div><div class="hero"><span class="badge">✦ AI-style tool</span><h1>${title}</h1></div><div class="card">${html}</div></div>`;home.classList.add('hidden');toolview.classList.remove('hidden')}
function numTool(title,label1,label2,fn){shell(title,`<div class="row"><div><label>${label1}</label><input id="a" type="number"></div><div><label>${label2}</label><input id="b" type="number"></div></div><div class="actions"><button onclick="${fn}()">Calculate</button></div><div id="out" class="result"></div>`)}
function go(hash){let id=hash.replace('#','');if(!id||id==='home'){home.classList.remove('hidden');toolview.classList.add('hidden');return}
if(id==='age')shell('Age Calculator',`<label>Date of birth</label><input id="dob" type="date"><div class="actions"><button onclick="age()">Calculate Age</button></div><div id="out" class="result">Enter your date of birth.</div>`);
else if(id==='profit')numTool('Profit Calculator','Cost','Revenue','profit');
else if(id==='percentage')numTool('Percentage Calculator','Part','Total','percentage');
else if(id==='discount')numTool('Discount Calculator','Price','Discount %','discount');
else if(id==='emi')shell('Loan / EMI Calculator',`<div class="row3"><div><label>Loan amount</label><input id="p" type="number" value="100000"></div><div><label>Annual interest %</label><input id="r" type="number" value="10"></div><div><label>Years</label><input id="y" type="number" value="5"></div></div><div class="actions"><button onclick="emi()">Calculate EMI</button></div><div id="out" class="result"></div>`);
else if(id==='bmi')shell('BMI Calculator',`<div class="row"><div><label>Weight kg</label><input id="w" type="number"></div><div><label>Height cm</label><input id="h" type="number"></div></div><div class="actions"><button onclick="bmi()">Calculate BMI</button></div><div id="out" class="result"></div>`);
else if(id==='tax')numTool('Tax Calculator','Amount','Tax %','tax');
else if(id==='units')shell('Unit Converter',`<div class="row3"><div><label>Value</label><input id="uv" type="number" value="1"></div><div><label>From</label><select id="uf"><option>km</option><option>m</option><option>cm</option><option>mi</option><option>kg</option><option>lb</option><option>C</option><option>F</option></select></div><div><label>To</label><select id="ut"><option>m</option><option>km</option><option>cm</option><option>mi</option><option>kg</option><option>lb</option><option>C</option><option>F</option></select></div></div><div class="actions"><button onclick="units()">Convert</button></div><div id="out" class="result"></div>`);
else if(id==='qr')shell('QR Code Generator',`<label>Text or URL</label><input id="q" placeholder="https://example.com"><div class="actions"><button onclick="qr()">Generate QR</button></div><div id="out" class="result" style="text-align:center"></div>`);
else if(['compress','jpg','png','webp'].includes(id))imageTool(id);
else if(id==='resize')shell('Image Resizer',`<label>Choose image</label><input id="file" type="file" accept="image/*"><div class="row"><div><label>Width</label><input id="nw" type="number"></div><div><label>Height</label><input id="nh" type="number"></div></div><div class="actions"><button onclick="resizeImg()">Resize & Download</button></div><div id="out" class="result"></div>`);
else if(id==='rotate')shell('Image Rotator',`<label>Choose image</label><input id="file" type="file" accept="image/*"><div class="actions"><button onclick="rotate(90)">Rotate 90°</button><button class="secondary" onclick="rotate(180)">Rotate 180°</button></div><div id="out" class="result"></div>`);
else if(id==='imagepdf')shell('Image to PDF',`<label>Choose image</label><input id="file" type="file" accept="image/*"><div class="actions"><button onclick="imagePDF()">Open PDF print view</button></div><div id="out" class="result"></div>`);
else if(id==='ocr')shell('Image to Text',`<label>Choose image</label><input id="file" type="file" accept="image/*"><div class="actions"><button onclick="ocr()">Extract Text</button></div><textarea id="out" placeholder="OCR result"></textarea><p class="small">OCR uses Tesseract.js and needs internet on first load.</p>`);
else if(id==='counter')shell('Word & Character Counter',`<textarea id="txt" oninput="counter()" placeholder="Type or paste text..."></textarea><div id="out" class="result">Words: 0 · Characters: 0 · Lines: 0</div>`);
else if(id==='case')shell('Case Converter',`<textarea id="txt" placeholder="Enter text..."></textarea><div class="actions"><button onclick="cas('upper')">UPPERCASE</button><button onclick="cas('lower')">lowercase</button><button onclick="cas('title')">Title Case</button><button onclick="cas('sentence')">Sentence case</button></div>`);
else if(id==='textpdf')shell('Text to PDF',`<textarea id="txt" placeholder="Write or paste text..."></textarea><div class="actions"><button onclick="textPDF()">Open PDF print view</button></div>`);
else if(id==='invoice')shell('Invoice Maker',`<div class="row"><div><label>Business</label><input id="biz"></div><div><label>Customer</label><input id="cus"></div></div><div class="row"><div><label>Item</label><input id="item"></div><div><label>Amount</label><input id="amt" type="number"></div></div><div class="actions"><button onclick="invoice()">Create Invoice</button></div><div id="out" class="result"></div>`);
else if(id==='weather')weatherPage();
}
function age(){let d=new Date(dob.value),n=new Date(),y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),da=n.getDate()-d.getDate();if(da<0){m--;da+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}out.innerHTML=`<b>${y} years, ${m} months, ${da} days</b>`}
function profit(){let c=+a.value,r=+b.value,p=r-c;out.innerHTML=`<b>${p>=0?'Profit':'Loss'}: ${p.toFixed(2)}</b><br>Margin: ${r?(p/r*100).toFixed(2):0}%`}
function percentage(){out.innerHTML=`<b>${(+b.value?(+a.value/+b.value*100):0).toFixed(2)}%</b>`}
function discount(){let p=+a.value,d=+b.value,s=p*d/100;out.innerHTML=`Discount: <b>${s.toFixed(2)}</b><br>Final price: <b>${(p-s).toFixed(2)}</b>`}
function tax(){let p=+a.value,t=+b.value,s=p*t/100;out.innerHTML=`Tax: <b>${s.toFixed(2)}</b><br>Total: <b>${(p+s).toFixed(2)}</b>`}
function emi(){let P=+p.value,R=+r.value/1200,N=+y.value*12,e=R?P*R*(1+R)**N/((1+R)**N-1):P/N;out.innerHTML=`Monthly EMI: <b>${e.toFixed(2)}</b><br>Total payment: ${(e*N).toFixed(2)}<br>Total interest: ${(e*N-P).toFixed(2)}`}
function bmi(){let b=+w.value/((+h.value/100)**2);out.innerHTML=`BMI: <b>${b.toFixed(1)}</b><br>${b<18.5?'Underweight':b<25?'Normal range':b<30?'Overweight':'Obesity'}`}
function units(){let x=+uv.value,A=uf.value,B=ut.value,L={m:1,km:1000,cm:.01,mi:1609.344},Q={kg:1,lb:.45359237},z=A in L&&B in L?x*L[A]/L[B]:A in Q&&B in Q?x*Q[A]/Q[B]:A==='C'&&B==='F'?x*9/5+32:A==='F'&&B==='C'?(x-32)*5/9:A===B?x:null;out.innerHTML=z===null?'Choose compatible units.':`<b>${z.toFixed(4)}</b> ${B}`}
function qr(){let s=encodeURIComponent(q.value.trim());out.innerHTML=s?`<img style="max-width:280px" src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${s}">`:'Enter text or URL.'}
function imageTool(id){let title={compress:'Image Compressor',jpg:'Image to JPG',png:'Image to PNG',webp:'Image to WEBP'}[id];shell(title,`<label>Choose image</label><input id="file" type="file" accept="image/*"><div class="actions"><button onclick="convertImage('${id}')">Convert & Download</button></div><div id="out" class="result"></div>`)}
function readImage(){let f=file.files[0];return f?new Promise(res=>{let i=new Image();i.onload=()=>res(i);i.src=URL.createObjectURL(f)}):null}
async function convertImage(id){let i=await readImage();if(!i)return out.textContent='Choose an image.';let c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);let type=id==='jpg'||id==='compress'?'image/jpeg':id==='png'?'image/png':'image/webp';c.toBlob(b=>download(b,'easytools.'+type.split('/')[1]),type,id==='compress'?.55:.9)}
async function resizeImg(){let i=await readImage();if(!i)return;let w=+nw.value||i.width,h=+nh.value||i.height,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);c.toBlob(b=>download(b,'resized.jpg'),'image/jpeg',.88)}
async function rotate(deg){let i=await readImage();if(!i)return;let c=document.createElement('canvas'),s=deg%180?1:0;c.width=s?i.height:i.width;c.height=s?i.width:i.height;let g=c.getContext('2d');g.translate(c.width/2,c.height/2);g.rotate(deg*Math.PI/180);g.drawImage(i,-i.width/2,-i.height/2);c.toBlob(b=>download(b,'rotated.jpg'),'image/jpeg',.9)}
function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
async function imagePDF(){let f=file.files[0];if(!f)return;let src=URL.createObjectURL(f),w=open('');w.document.write(`<html><body style="text-align:center"><img src="${src}" style="max-width:100%"><script>onload=()=>print()<\/script></body></html>`);w.document.close()}
async function ocr(){if(!window.Tesseract){let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.body.appendChild(s);await new Promise(r=>s.onload=r)}let f=file.files[0];if(!f)return out.value='Choose an image.';out.value='Reading image...';let r=await Tesseract.recognize(f,'eng');out.value=r.data.text}
function counter(){let s=txt.value;out.innerHTML=`Words: <b>${s.trim()?s.trim().split(/\\s+/).length:0}</b> · Characters: <b>${s.length}</b> · Lines: <b>${s?s.split('\\n').length:0}</b>`}
function cas(k){let s=txt.value;if(k==='upper')txt.value=s.toUpperCase();if(k==='lower')txt.value=s.toLowerCase();if(k==='title')txt.value=s.toLowerCase().replace(/\\b\\w/g,c=>c.toUpperCase());if(k==='sentence')txt.value=s.toLowerCase().replace(/(^|[.!?]\\s+)\\w/g,c=>c.toUpperCase())}
function textPDF(){let safe=txt.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\n/g,'<br>'),w=open('');w.document.write(`<html><body style="font:16px Arial;line-height:1.6;padding:30px">${safe}<script>onload=()=>print()<\/script></body></html>`);w.document.close()}
function invoice(){let a=+amt.value||0;out.innerHTML=`<div style="background:white;color:#111;padding:24px;border-radius:12px"><h2>${biz.value||'Invoice'}</h2><p>Bill to: ${cus.value||'Customer'}</p><hr><p>${item.value||'Item'} <b style="float:right">${a.toFixed(2)}</b></p><hr><h3>Total <span style="float:right">${a.toFixed(2)}</span></h3><button onclick="print()">Print / Save PDF</button></div>`}
function weatherPage(){shell('Weather',`<div class="weather-search" style="display:flex;gap:8px;margin-bottom:12px"><input id="city" value="Kasur" placeholder="Search city"><button onclick="loadWeather()">Search</button></div><div id="status" class="small">Loading weather...</div><div class="weather-now"><div>Now</div><div class="nowmain"><div><div id="temp" class="temp">--°</div><div id="place" class="small">--</div></div><div class="condition"><div id="icon" style="font-size:55px">☁️</div><div id="cond">Loading...</div><div class="small">Feels like <span id="feels">--</span>°</div></div></div><div id="hourly" class="hourly"></div></div><div id="trend" class="warming">↗ Weather trend loading...</div><div id="days" class="days"></div><div class="stats"><div class="stat">🌧️ <b>Precipitation</b><div id="rain" class="small">--%</div></div><div class="stat">💨 <b>Wind</b><div id="wind" class="small">-- km/h</div></div></div>`);loadWeather()}
async function loadWeather(){try{status.textContent='Updating weather...';let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city.value)+'&count=1&language=en&format=json').then(r=>r.json());if(!g.results?.length)throw Error('City not found');let q=g.results[0];let u=`https://api.open-meteo.com/v1/forecast?latitude=${q.latitude}&longitude=${q.longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;let d=await fetch(u).then(r=>r.json()),c=d.current,m=W[c.weather_code]||['☁️','Weather'];place.textContent=q.name+(q.country?', '+q.country:'');temp.textContent=Math.round(c.temperature_2m)+'°';feels.textContent=Math.round(c.apparent_temperature);icon.textContent=m[0];cond.textContent=m[1];wind.textContent=Math.round(c.wind_speed_10m)+' km/h';rain.textContent=Math.round(d.daily.precipitation_probability_max[0]||0)+'%';let hs=d.hourly.time.map((t,i)=>({t,i})).filter(o=>new Date(o.t)>=new Date(c.time)).slice(0,6);hourly.innerHTML=hs.map(o=>`<div>${Math.round(d.hourly.temperature_2m[o.i])}°<div class="wi">${(W[d.hourly.weather_code[o.i]]||['☁️'])[0]}</div><div>${new Date(o.t).toLocaleTimeString([],{hour:'numeric'})}</div></div>`).join('');days.innerHTML=d.daily.time.map((t,i)=>`<div class="day ${i===0?'active':''}">${i===0?'Today':new Date(t).toLocaleDateString([],{weekday:'short'})}<div class="wi">${(W[d.daily.weather_code[i]]||['☁️'])[0]}</div>${Math.round(d.daily.temperature_2m_max[i])}°/${Math.round(d.daily.temperature_2m_min[i])}°</div>`).join('');let delta=Math.round(d.daily.temperature_2m_max[6]-d.daily.temperature_2m_max[0]);trend.textContent=(delta>=0?'↗ Warming':'↘ Cooling')+' expected over the next 6 days';status.textContent='Updated from Open-Meteo';}catch(e){status.textContent=e.message||'Weather unavailable.'}}
addEventListener('hashchange',()=>go(location.hash));go(location.hash||'#home');
// lightweight animated AI/neural background
const c=document.getElementById('bg'),x=c.getContext('2d');let w,h,p=[];
function rs(){w=innerWidth;h=innerHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);p=Array.from({length:w<700?32:55},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}))}function anim(){x.clearRect(0,0,w,h);p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;x.fillStyle='#79b6ffb8';x.beginPath();x.arc(a.x,a.y,1.4,0,7);x.fill()});for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){let a=p[i],b=p[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<125){x.strokeStyle=`rgba(92,178,255,${(1-d/125)*.14})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}requestAnimationFrame(anim)}addEventListener('resize',rs);rs();anim();
</script>
</body></html>
